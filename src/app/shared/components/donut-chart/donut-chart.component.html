<div class="donut-chart">
  <svg class="donut-chart__svg" viewBox="0 0 36 36" role="img" [attr.aria-label]="centerLabel()">
    <defs>
      @for (segment of segments(); track segment.label) {
        <!--
          Radial, not linear: shading goes inner-edge -> outer-edge of the
          ring's own stroke width (a tube's cross-section), so every segment
          gets the same cylindrical shine regardless of where it sits on the
          circle. A gradient anchored to screen position instead would make
          whichever segment happens to land at 12 o'clock double up with the
          highlight arc below and wash out.
        -->
        <radialGradient [attr.id]="segment.gradientId" cx="18" cy="18" r="17.5" gradientUnits="userSpaceOnUse">
          <stop offset="80%" [attr.stop-color]="'color-mix(in oklch, ' + segment.color + ' 100%, black 22%)'"></stop>
          <stop offset="91%" [attr.stop-color]="'color-mix(in oklch, ' + segment.color + ' 100%, white 30%)'"></stop>
          <stop offset="100%" [attr.stop-color]="'color-mix(in oklch, ' + segment.color + ' 100%, black 22%)'"></stop>
        </radialGradient>
      }
    </defs>

    <circle class="donut-chart__track" cx="18" cy="18" r="15.9155" fill="none"></circle>

    @for (segment of segments(); track segment.label) {
      <circle
        class="donut-chart__segment"
        cx="18"
        cy="18"
        r="15.9155"
        fill="none"
        [attr.stroke]="'url(#' + segment.gradientId + ')'"
        [style.stroke-dasharray]="segment.dashArray"
        [style.stroke-dashoffset]="segment.dashOffset"
      >
        <title>{{ segment.label }}: {{ segment.value }} ({{ segment.percent | number: '1.0-0' }}%)</title>
      </circle>
    }
  </svg>
  <div class="donut-chart__center">
    <span class="donut-chart__center-value">{{ total() }}</span>
    @if (centerLabel()) {
      <span class="donut-chart__center-label">{{ centerLabel() }}</span>
    }
  </div>
</div>

<ul class="donut-chart__legend" role="list">
  @for (segment of segments(); track segment.label) {
    <li class="donut-chart__legend-row">
      <span class="donut-chart__legend-swatch" [style.background]="segment.color"></span>
      <span class="donut-chart__legend-label">{{ segment.label }}</span>
      <span class="donut-chart__legend-value">{{ segment.value }}</span>
    </li>
  }
</ul>
