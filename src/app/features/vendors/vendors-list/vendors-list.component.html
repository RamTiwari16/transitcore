<div class="page-header">
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Add Vendor
  </a>
</div>

<app-data-table
  [columns]="columns()"
  [rows]="list.rows()"
  [totalCount]="list.totalCount()"
  [loading]="list.loading()"
  [pageIndex]="list.pageIndex()"
  [pageSize]="list.pageSize()"
  [rowId]="rowId"
  [filterValue]="list.filterText()"
  emptyTitle="No vendors yet"
  emptyDescription="Add your first vendor to start assigning hired trucks."
  (pageChange)="list.onPage($event)"
  (sortChange)="list.onSort($event)"
  (filterChange)="list.onFilter($event)"
  (rowClick)="openVendor($event)"
>
  <ng-template #rowActions let-row>
    <a mat-icon-button [routerLink]="[row.id, 'edit']" matTooltip="Edit vendor" aria-label="Edit vendor">
      <mat-icon>edit</mat-icon>
    </a>
  </ng-template>
</app-data-table>
