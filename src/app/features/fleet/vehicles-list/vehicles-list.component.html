<div class="page-header">
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Add Vehicle
  </a>
</div>

<app-data-table
  [columns]="columns()"
  [rows]="list.rows()"
  [totalCount]="list.totalCount()"
  [loading]="list.loading()"
  [pageIndex]="list.pageIndex()"
  [pageSize]="list.pageSize()"
  [rowId]="rowId"
  [filterValue]="list.filterText()"
  filterPlaceholder="Search this page..."
  emptyTitle="No vehicles yet"
  emptyDescription="Add your first vehicle to start tracking your fleet."
  (pageChange)="list.onPage($event)"
  (filterChange)="list.onFilter($event)"
  (rowClick)="openVehicle($event)"
>
  <ng-template #rowActions let-row>
    <a mat-icon-button [routerLink]="[row.id, 'edit']" matTooltip="Edit vehicle" aria-label="Edit vehicle">
      <mat-icon>edit</mat-icon>
    </a>
  </ng-template>
</app-data-table>
