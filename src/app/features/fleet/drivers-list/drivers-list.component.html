<div class="page-header">
  <h1>Drivers</h1>
</div>

@if (!loading() && drivers().length > 0) {
  <table mat-table [dataSource]="drivers()" class="billing-table">
    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.fullName }}</td>
    </ng-container>
    <ng-container matColumnDef="phoneNo">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let row">{{ row.phoneNo || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="hireDate">
      <th mat-header-cell *matHeaderCellDef>Hire Date</th>
      <td mat-cell *matCellDef="let row">{{ formatDate(row.hireDate) }}</td>
    </ng-container>
    <ng-container matColumnDef="statusName">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.statusName }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
} @else if (!loading()) {
  <app-empty-state title="No drivers yet" icon="badge"></app-empty-state>
}
