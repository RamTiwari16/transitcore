<div class="page-header">
  <h1>Invoices</h1>
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Add Invoice
  </a>
</div>

<app-data-table
  [columns]="columns()"
  [rows]="rows()"
  [totalCount]="totalCount()"
  [loading]="loading()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [rowId]="rowId"
  emptyTitle="No invoices yet"
  emptyDescription="Add your first invoice to start billing customers."
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
>
  <ng-template #rowActions let-row>
    <button
      mat-icon-button
      (click)="downloadPdf(row)"
      [disabled]="downloadingId() !== null"
      matTooltip="Download PDF"
      [attr.aria-label]="'Download PDF for invoice ' + row.invoiceNo"
    >
      @if (downloadingId() === row.id) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <mat-icon>picture_as_pdf</mat-icon>
      }
    </button>
  </ng-template>
</app-data-table>
