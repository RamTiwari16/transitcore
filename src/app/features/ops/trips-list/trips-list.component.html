<div class="page-header">
  <h1>Trips</h1>
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Schedule Trip
  </a>
</div>

<mat-form-field appearance="outline" class="trips-list__filter" subscriptSizing="dynamic">
  <mat-label>Status</mat-label>
  <mat-select
    [value]="statusFilter()"
    (selectionChange)="onStatusFilterChange($event.value)"
  >
    <mat-option [value]="null">All statuses</mat-option>
    @for (status of statusOptions(); track status.id) {
      <mat-option [value]="status.id">{{ status.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<app-data-table
  [columns]="columns()"
  [rows]="rows()"
  [totalCount]="totalCount()"
  [loading]="loading()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [rowId]="rowId"
  emptyTitle="No trips found"
  emptyDescription="Schedule a trip to see it listed here."
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (rowClick)="openTrip($event)"
></app-data-table>
