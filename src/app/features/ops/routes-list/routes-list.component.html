<div class="page-header">
  <h1>Routes</h1>
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Add Route
  </a>
</div>

<app-data-table
  [columns]="columns()"
  [rows]="rows()"
  [totalCount]="totalCount()"
  [loading]="loading()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [rowId]="rowId"
  emptyTitle="No routes yet"
  emptyDescription="Add your first route to start scheduling trips."
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
></app-data-table>
