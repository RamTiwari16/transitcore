<div class="page-header">
  <h1>Routes</h1>
</div>

@if (!loading() && routes().length > 0) {
  <table mat-table [dataSource]="routes()" class="billing-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Route</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>
    <ng-container matColumnDef="originCityName">
      <th mat-header-cell *matHeaderCellDef>Origin</th>
      <td mat-cell *matCellDef="let row">{{ row.originCityName }}</td>
    </ng-container>
    <ng-container matColumnDef="destinationCityName">
      <th mat-header-cell *matHeaderCellDef>Destination</th>
      <td mat-cell *matCellDef="let row">{{ row.destinationCityName }}</td>
    </ng-container>
    <ng-container matColumnDef="distanceKm">
      <th mat-header-cell *matHeaderCellDef>Distance (km)</th>
      <td mat-cell *matCellDef="let row">{{ row.distanceKm ?? '-' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
} @else if (!loading()) {
  <app-empty-state title="No routes yet" icon="alt_route"></app-empty-state>
}
